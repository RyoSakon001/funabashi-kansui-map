<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>船橋冠水マップ</title>
<meta name="description" content="船橋市内の冠水しやすいエリアを示すマップと、経路検索ツールです。" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>船橋冠水マップ</h1>
    <p class="lead">大雨時に冠水しやすいエリアを確認し、安全なルートを検討するための地図です。</p>
  </header>

  <div id="status-banner" class="status-banner" hidden></div>

  <main>
    <section class="panel" aria-labelledby="flood-map-heading">
      <h2 id="flood-map-heading">冠水エリアマップ</h2>
      <p class="panel-desc">登録済みの冠水ポイントを表示しています(ピンの位置は固定です)。</p>
      <div class="map-frame">
        <iframe
          id="mymaps-frame"
          src=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <section class="panel" aria-labelledby="route-heading">
      <h2 id="route-heading">ルート検索</h2>
      <p class="panel-desc">出発地と目的地を入力すると、ルートを地図上に表示します。</p>

      <form id="route-form" class="route-form">
        <label for="origin">出発地</label>
        <input type="text" id="origin" name="origin" placeholder="例: 船橋駅" required />

        <label for="destination">目的地</label>
        <input type="text" id="destination" name="destination" placeholder="例: 船橋市役所" required />

        <label for="mode">移動方法</label>
        <select id="mode" name="mode">
          <option value="driving">車</option>
          <option value="walking">徒歩</option>
          <option value="bicycling">自転車</option>
          <option value="transit">公共交通機関</option>
        </select>

        <button type="submit">ルートを表示</button>
      </form>

      <div class="map-frame route-map-frame" id="route-map-container" hidden>
        <iframe
          id="route-frame"
          src=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
      <p id="route-error" class="route-error" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>地図データ: Google マイマップ / Google Maps Embed API</p>
  </footer>

  <script src="js/site-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
