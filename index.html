<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>船橋冠水マップ</title>
<meta name="description" content="船橋市内の冠水しやすいエリアを示すマップと、経路検索ツールです。" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
/>
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1><span class="material-symbols-outlined" aria-hidden="true">water_drop</span>船橋冠水マップ</h1>
    <p class="lead">大雨時に冠水しやすいエリアを確認し、安全なルートを検討するための地図です。</p>
  </header>

  <div id="status-banner" class="status-banner" hidden></div>

  <main>
    <section class="panel" aria-labelledby="map-heading">
      <h2 id="map-heading">冠水エリア & ルート検索</h2>
      <p class="panel-desc">登録済みの冠水ポイント(固定)を表示しています。</p>

      <details class="route-details">
        <summary>
          <span class="material-symbols-outlined" aria-hidden="true">directions_car</span>
          ルート検索(出発地 → 目的地)
          <span class="material-symbols-outlined chevron" aria-hidden="true">expand_more</span>
        </summary>
        <form id="route-form" class="route-form">
          <div class="field">
            <label for="origin">出発地</label>
            <gmp-place-autocomplete id="origin" placeholder="例: 船橋駅"></gmp-place-autocomplete>
          </div>

          <div class="field">
            <label for="destination">目的地</label>
            <gmp-place-autocomplete id="destination" placeholder="例: 船橋市役所"></gmp-place-autocomplete>
          </div>

          <button type="submit">
            <span class="material-symbols-outlined" aria-hidden="true">navigation</span>
            ルートを表示(車)
          </button>
        </form>
      </details>

      <div class="map-frame" id="map-container">
        <div id="map"></div>
      </div>
      <p id="map-error" class="route-error" hidden></p>
      <p id="route-error" class="route-error" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>冠水ポイントデータ: 船橋市公表資料 / 地図: Google Maps JavaScript API</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
